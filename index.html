<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minecraft Survival Test - Pure Local</title>
    
    <!-- CheerpJ 5.0 (suporta applets + LWJGL/OpenGL via WebAssembly) -->
    <script src="https://cjrtnc.leaningtech.com/5.0/loader.js"></script>
    
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #111; color: #fff; font-family: Arial, sans-serif; -webkit-user-select: none; user-select: none; }
        body { overflow: hidden; touch-action: none; }
        
        /* Tela de Inicializacao */
        #startup { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #111; z-index: 9999; }
        #box { width: min(90%, 500px); padding: 25px; background: #181818; border: 1px solid #333; border-radius: 8px; text-align: center; }
        #title { font-size: 24px; margin-bottom: 18px; }
        #status { color: #bbb; margin-bottom: 10px; }
        #time { color: #777; font-family: monospace; font-size: 13px; }
        #bar { height: 5px; margin-top: 20px; background: #333; border-radius: 5px; overflow: hidden; }
        #barInner { width: 0%; height: 100%; background: #aaa; transition: width .3s; }
        #startButton { display: none; margin-top: 20px; padding: 12px 24px; border: 0; border-radius: 5px; background: #eee; color: #111; font-size: 16px; font-weight: bold; cursor: pointer; }
        #error { display: none; margin-top: 20px; padding: 10px; background: #241515; border: 1px solid #633; color: #ff8888; text-align: left; font-family: monospace; font-size: 12px; white-space: pre-wrap; max-height: 200px; overflow: auto; }
        
        /* Area do Jogo e Controles */
        #game-container { display: none; width: 100vw; height: 100vh; position: relative; background: #000; }
        #game { width: 100%; height: 100%; }
        canvas, cheerpj-applet { display: block; width: 100% !important; height: 100% !important; }

        /* Camada de Controles Overlay */
        #controls-overlay { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
        .btn-mobile { position: absolute; pointer-events: auto; background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.4); border-radius: 8px; color: white; font-weight: bold; display: flex; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none; }
        .btn-mobile:active { background: rgba(255, 255, 255, 0.4); }

        /* D-PAD */
        #dpad { position: absolute; bottom: 30px; left: 30px; width: 150px; height: 150px; pointer-events: auto; }
        .dpad-btn { width: 45px; height: 45px; position: absolute; background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.4); border-radius: 6px; color: white; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        .dpad-btn:active { background: rgba(255, 255, 255, 0.4); }
        #btn-up    { top: 0; left: 52px; }
        #btn-left  { top: 52px; left: 0; }
        #btn-right { top: 52px; right: 0; }
        #btn-down  { bottom: 0; left: 52px; }

        /* Botoes de Acao */
        #btn-jump   { bottom: 50px; right: 40px; width: 65px; height: 65px; border-radius: 50%; font-size: 14px; }
        #btn-attack { bottom: 130px; right: 120px; width: 60px; height: 60px; font-size: 12px; }
        #btn-build  { bottom: 50px; right: 130px; width: 60px; height: 60px; font-size: 12px; }
        
        /* Menus */
        #btn-esc   { top: 15px; left: 20px; width: 50px; height: 35px; font-size: 12px; }
        #btn-inv   { top: 15px; right: 20px; width: 50px; height: 35px; font-size: 12px; }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="startup">
        <div id="box">
            <div id="title">Minecraft Survival Test</div>
            <div id="status">Iniciando interpretador Java...</div>
            <div id="time">0.0s</div>
            <div id="bar"><div id="barInner"></div></div>
            <button id="startButton">Iniciar Minecraft</button>
            <div id="error"></div>
        </div>
    </div>

    <!-- Interface Ativa do Jogo -->
    <div id="game-container">
        <div id="game"></div>
        <canvas id="lwjgl" tabindex="0" style="position:absolute;inset:0;z-index:5;outline:none;"></canvas>
        
        <div id="controls-overlay">
            <div id="dpad">
                <div id="btn-up" class="dpad-btn">&#9650;</div>
                <div id="btn-left" class="dpad-btn">&#9664;</div>
                <div id="btn-right" class="dpad-btn">&#9654;</div>
                <div id="btn-down" class="dpad-btn">&#9660;</div>
            </div>

            <div id="btn-jump" class="btn-mobile">PULO</div>
            <div id="btn-attack" class="btn-mobile">QUEBR</div>
            <div id="btn-build" class="btn-mobile">BLOCO</div>

            <div id="btn-esc" class="btn-mobile">ESC</div>
            <div id="btn-inv" class="btn-mobile">INV</div>
        </div>
    </div>

    <script>
        "use strict";

        const startup = document.getElementById("startup");
        const status = document.getElementById("status");
        const timeElement = document.getElementById("time");
        const bar = document.getElementById("barInner");
        const startButton = document.getElementById("startButton");
        const errorBox = document.getElementById("error");
        const gameContainer = document.getElementById("game-container");
        const gameZone = document.getElementById("game");

        const startTime = performance.now();
        function elapsed() { return ((performance.now() - startTime) / 1000).toFixed(1); }
        setInterval(() => { timeElement.textContent = elapsed() + "s"; }, 250);

        function setStatus(text, progress) {
            status.textContent = text;
            if (progress !== undefined) bar.style.width = progress + "%";
        }

        function showError(error) {
            status.textContent = "Erro na Execucao";
            bar.style.width = "0%";
            errorBox.style.display = "block";
            errorBox.textContent = String(error && error.stack ? error.stack : error);
        }

        window.addEventListener("error", (e) => showError(new Error(`JS: ${e.message}\nLinha: ${e.lineno}`)));

        async function iniciarCheerpJ() {
            try {
                if (typeof cheerpjInit !== "function") {
                    throw new Error("A funcao cheerpjInit() nao foi encontrada no script oficial.");
                }
                setStatus("Configurando ambiente mobile...", 50);
                // /app/ = raiz do servidor; usamos a pasta desta pagina para achar cheerpj-natives mesmo em subpastas
                const baseDir = location.pathname.replace(/[^\/]*$/, "");
                const nativesPath = "/app" + baseDir + "cheerpj-natives/natives-v18";
                console.log("LWJGL natives em:", nativesPath + "/lwjgl.js");
                await cheerpjInit({ javaProperties: ["java.library.path=" + nativesPath] }); // Java 8 (padrao) + LWJGL em JS
                setStatus("Ambiente pronto!", 100);
                startButton.style.display = "inline-block";
            } catch (error) {
                showError(error);
            }
        }

        function iniciarMinecraft() {
            try {
                startButton.disabled = true;
                setStatus("Construindo janela grafica...", 100);
                gameZone.innerHTML = "";

                // Canvas onde o LWJGL (cheerpj-natives) desenha o OpenGL — precisa existir ANTES do applet iniciar
                const W = Math.max(320, window.innerWidth), H = Math.max(240, window.innerHeight);
                const glc = document.getElementById("lwjgl");
                glc.width = W; glc.height = H;
                window.lwjglCanvasElement = glc;
                const applet = document.createElement("cheerpj-applet");
                applet.setAttribute("code", "com.mojang.minecraft.MinecraftApplet");
                
                // Usando caminhos estritamente relativos puros sem barra inicial para o CheerpJ 3.0 ler a pasta atual
                applet.setAttribute("archive","minecraft.jar,lwjgl.jar,lwjgl_util.jar,jinput.jar,lzma.jar");
                applet.setAttribute("width", String(W));
                applet.setAttribute("height", String(H));

                adicionarParametro(applet, "username", "Player Mobile");
                adicionarParametro(applet, "sessionid", "0");
                adicionarParametro(applet, "fullscreen", "false");
                adicionarParametro(applet, "mobs", "true");

                startup.style.display = "none";
                gameContainer.style.display = "block";
                gameZone.appendChild(applet);

                configurarMapeamentoBotoes();
                setTimeout(() => glc.focus(), 500);
                glc.addEventListener("click", () => glc.focus());
            } catch (error) {
                showError(error);
            }
        }

        function adicionarParametro(applet, nome, valor) {
            const param = document.createElement("param");
            param.setAttribute("name", nome);
            param.setAttribute("value", valor);
            applet.appendChild(param);
        }

        function configurarMapeamentoBotoes() {
            function simularTecla(codigoTecla, tipoEvento) {
                let keyCodeNum = 0;
                if (codigoTecla === "Space") keyCodeNum = 32;
                else if (codigoTecla === "Escape") keyCodeNum = 27;
                else keyCodeNum = codigoTecla.charCodeAt(3);

                const evento = new KeyboardEvent(tipoEvento, {
                    bubbles: true,
                    cancelable: true,
                    key: codigoTecla,
                    code: codigoTecla,
                    keyCode: keyCodeNum
                });
                
                document.dispatchEvent(evento);
                const canvasJogo = document.getElementById("lwjgl");
                if (canvasJogo) canvasJogo.dispatchEvent(evento);
            }

            const mapaTeclas = [
                { id: "btn-up", key: "KeyW" },
                { id: "btn-left", key: "KeyA" },
                { id: "btn-down", key: "KeyS" },
                { id: "btn-right", key: "KeyD" },
                { id: "btn-jump", key: "Space" },
                { id: "btn-inv", key: "KeyB" }, 
                { id: "btn-esc", key: "Escape" }
            ];

            mapaTeclas.forEach(alvo => {
                const elemento = document.getElementById(alvo.id);
                if (!elemento) return;
                
                elemento.addEventListener("touchstart", (e) => {
                    e.preventDefault();
                    simularTecla(alvo.key, "keydown");
                });
                elemento.addEventListener("touchend", (e) => {
                    e.preventDefault();
                    simularTecla(alvo.key, "keyup");
                });
            });

            const btnAttack = document.getElementById("btn-attack");
            const btnBuild = document.getElementById("btn-build");

            function simularCliqueMouse(botaoMouse, tipoEvento) {
                const canvasJogo = document.getElementById("lwjgl") || document;
                const rect = canvasJogo.getBoundingClientRect();
                
                const eventoMouse = new MouseEvent(tipoEvento, {
                    bubbles: true,
                    cancelable: true,
                    view: window,
                    button: botaoMouse,
                    clientX: rect.left + rect.width / 2,
                    clientY: rect.top + rect.height / 2
                });
                
                canvasJogo.dispatchEvent(eventoMouse);
            }

            if (btnAttack) {
                btnAttack.addEventListener("touchstart", (e) => { e.preventDefault(); simularCliqueMouse(0, "mousedown"); }); 
                btnAttack.addEventListener("touchend", (e) => { e.preventDefault(); simularCliqueMouse(0, "mouseup"); });
            }
            
            if (btnBuild) {
                btnBuild.addEventListener("touchstart", (e) => { e.preventDefault(); simularCliqueMouse(2, "mousedown"); }); 
                btnBuild.addEventListener("touchend", (e) => { e.preventDefault(); simularCliqueMouse(2, "mouseup"); });
            }
        }

        window.addEventListener("load", () => { setTimeout(iniciarCheerpJ, 1000); });
        startButton.addEventListener("click", iniciarMinecraft);
    </script>
</body>
</html>
